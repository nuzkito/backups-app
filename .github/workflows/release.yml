# Creates a GitHub release with the portable Windows package when a version tag is pushed.
# The tag must be the version in Cargo.toml (for example, tag `0.2.0` for version 0.2.0).
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  # Same Rust version as the Dockerfile.
  RUST_VERSION: "1.100.0"
  TARGET: x86_64-pc-windows-gnu
  APP: backups

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version in Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Release notes: the text of the `## <version>` section of CHANGELOG.md, up to the next
      # `## ` heading.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          mkdir -p target
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if ($2 == version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > target/release-notes.md
          if ! grep -q '[^[:space:]]' target/release-notes.md; then
            echo "::error::CHANGELOG.md has no section '## $VERSION' with content"
            exit 1
          fi
          cat target/release-notes.md

      - name: Install the Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 zip

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Build in release mode
        run: cargo build --release --locked --target "$TARGET"

      - name: Build the portable package
        run: |
          mkdir -p target/portable
          PORTABLE="target/portable/$APP-$VERSION-portable.zip"
          rm -f "$PORTABLE"
          zip -j -9 "$PORTABLE" "target/$TARGET/release/$APP.exe"
          echo "PORTABLE=$PORTABLE" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PORTABLE" \
            --title "$GITHUB_REF_NAME" \
            --notes-file target/release-notes.md \
            --verify-tag
